[package]
name = "toni-grpc"
version = "0.1.0"
edition = "2024"
description = "gRPC transport adapter for the Toni framework"
license = "MIT"
keywords = ["toni", "grpc", "tonic", "framework", "adapter"]
categories = ["network-programming"]

[dependencies]
toni = { path = "../toni", default-features = false }
tonic = "0.14"
tower = { version = "0.5", features = ["util", "limit"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
http = "1"
futures-util = "0.3"
anyhow = "1.0"
tracing = "0.1"
http-body = "1"
async-trait = "0.1"