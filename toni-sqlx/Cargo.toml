[package]
name = "toni-sqlx"
version = "0.1.0"
edition = "2024"
description = "SQLx integration for the Toni framework"
license = "MIT"
repository = "https://github.com/monterxto/toni-rs"
homepage = "https://github.com/monterxto/toni-rs"

[features]
default = []
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
sqlite = ["sqlx/sqlite"]
runtime-tokio-rustls = ["sqlx/runtime-tokio-rustls"]
runtime-tokio-native-tls = ["sqlx/runtime-tokio-native-tls"]
health = ["dep:toni-terminus", "dep:serde_json", "dep:futures"]
integration = ["health", "postgres", "runtime-tokio-rustls"]

[dependencies]
toni = { path = "../toni", default-features = false, features = ["startup-check"] }
sqlx = { version = "0.8", default-features = false }
async-trait = "0.1"
parking_lot = "0.12"
tracing = "0.1"
toni-terminus = { path = "../toni-terminus", default-features = false, optional = true }
serde_json = { version = "1", optional = true }
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls"], default-features = false }
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toni-axum = { path = "../toni-axum" }
reqwest = { version = "0.13.2", features = ["json"] }
