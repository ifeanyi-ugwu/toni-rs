[package]
name = "toni-examples"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
toni = { path = "../toni" }
toni-macros = { path = "../toni-macros" }
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
validator = { version = "0.20.0", features = ["derive"] }
toni-axum = { path = "../toni-axum" }
toni-salvo = { path = "../toni-salvo" }
toni-poem = { path = "../toni-poem" }
toni-rocket = { path = "../toni-rocket" }
toni-config = { path = "../toni-config" }
toni-tcp = { path = "../toni-tcp" }
toni-udp = { path = "../toni-udp" }
toni-nats = { path = "../toni-nats" }
toni-grpc = { path = "../toni-grpc" }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
toni-terminus = { path = "../toni-terminus", features = ["http", "memory", "disk", "timeout"] }
chrono = "0.4"
anyhow = "1.0"
futures = "0.3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

