syntax = "proto3";

package toni_test.orders;

// One unary rpc, for the handler form where toni writes the trait impl.
service Greeter {
    rpc Greet (GreetRequest) returns (GreetReply);

    // Server streaming, for the handler form's stream reply.
    rpc GreetMany (GreetRequest) returns (stream GreetReply);

    // A reply with no natural end, for the abandoned-stream case.
    rpc GreetForever (GreetRequest) returns (stream GreetReply);
}

message GreetRequest {
    string name = 1;
}

message GreetReply {
    string message = 1;
}

service Orders {
    rpc Create (CreateOrderRequest) returns (CreateOrderResponse);

    // Server streaming: emits each order's status as it transitions.
    rpc WatchProgress (WatchRequest) returns (stream ProgressEvent);

    // Client streaming: ingests a sequence of items, returns a summary.
    rpc BulkCreate (stream CreateOrderRequest) returns (BulkCreateResponse);

    // Bidi streaming: client sends item updates, server echoes each one back
    // tagged with a server-assigned id.
    rpc Chat (stream ChatMessage) returns (stream ChatMessage);
}

message CreateOrderRequest {
    string item = 1;
    uint32 qty = 2;
}

message CreateOrderResponse {
    uint64 id = 1;
    string status = 2;
}

message WatchRequest {
    uint64 id = 1;
}

message ProgressEvent {
    uint64 id = 1;
    string status = 2;
}

message BulkCreateResponse {
    uint32 created = 1;
    uint64 first_id = 2;
}

message ChatMessage {
    string text = 1;
    uint64 id = 2;
}
