[package]
name = "toni-redis-rpc"
version = "0.1.0"
edition = "2021"
description = "Redis Pub/Sub transport adapter for the Toni RPC gateway"
license = "MIT"
keywords = ["toni", "redis", "rpc", "framework", "adapter"]
categories = ["network-programming"]

[features]
# Gates tests that need a live Redis (via testcontainers + Docker).
integration = []

[dependencies]
toni = { path = "../toni", default-features = false }
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
futures = "0.3"

[dev-dependencies]
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["redis"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
