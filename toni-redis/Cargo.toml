[package]
name = "toni-redis"
version = "0.1.0"
edition = "2024"
description = "Redis integration for the Toni framework"
license = "MIT"
repository = "https://github.com/monterxto/toni-rs"
homepage = "https://github.com/monterxto/toni-rs"

[dependencies]
toni = { path = "../toni" }
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
async-trait = "0.1"
tracing = "0.1"
