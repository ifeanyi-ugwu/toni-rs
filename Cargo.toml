[workspace]
resolver = "3"
members = [
    "crates/ulo",
    "crates/ulo-macros",
]
# Crates not yet ported to the DI redesign; each moves to `members` once it is.
exclude = [
    "crates/ulo-build",
    "crates/ulo-cli",
    "crates/ulo-config",
    "crates/ulo-db-diesel",
    "crates/ulo-db-mongodb",
    "crates/ulo-db-prisma",
    "crates/ulo-db-redis",
    "crates/ulo-db-seaorm",
    "crates/ulo-db-sqlx",
    "crates/ulo-graphql-async-graphql",
    "crates/ulo-graphql-juniper",
    "crates/ulo-grpc",
    "crates/ulo-health",
    "crates/ulo-http-actix",
    "crates/ulo-http-axum",
    "crates/ulo-http-poem",
    "crates/ulo-http-rocket",
    "crates/ulo-http-salvo",
    "crates/ulo-rpc-conformance",
    "crates/ulo-rpc-kafka",
    "crates/ulo-rpc-mqtt",
    "crates/ulo-rpc-nats",
    "crates/ulo-rpc-rabbitmq",
    "crates/ulo-rpc-redis",
    "crates/ulo-rpc-tcp",
    "crates/ulo-rpc-udp",
    "crates/ulo-ws-redis",
    "crates/ulo-ws-tungstenite",
    "integration-tests",
    "examples",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ulo-rs/ulo"
homepage = "https://github.com/ulo-rs/ulo"

[workspace.dependencies]
anyhow = "1.0.95"
async-trait = "0.1.86"
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
futures-timer = "3"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
parking_lot = "0.12"
redis = "1"
reqwest = { version = "0.13", default-features = false }
serde = "1.0.217"
serde_json = "1.0.137"
testcontainers = "0.27.3"
testcontainers-modules = "0.15.0"
tokio = { version = "1.47", default-features = false }
tokio-stream = "0.1"
tokio-tungstenite = "0.28"
tower = { version = "0.5", default-features = false }
tracing = "0.1"
uuid = "1.11"
validator = "0.20.0"
