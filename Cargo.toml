[workspace]
resolver = "3"
members = [
    "crates/ulo",
    "crates/ulo-macros",
    "crates/ulo-handler-codegen",
    "crates/ulo-transport",
    "crates/ulo-transport-macros",
    "crates/ulo-net",
    "crates/ulo-tokio",
    "crates/ulo-hyper-serve",
    "crates/ulo-http",
    "crates/ulo-http-macros",
    "crates/ulo-http-hyper",
    "crates/ulo-http-axum",
    "crates/ulo-http-salvo",
    "crates/ulo-http-poem",
    "crates/ulo-http-actix",
    "crates/ulo-http-rocket",
    "crates/ulo-http-conformance",
    "crates/ulo-ws",
    "crates/ulo-ws-macros",
    "crates/ulo-ws-redis",
    "crates/ulo-rpc",
    "crates/ulo-rpc-macros",
    "crates/ulo-rpc-tcp",
    "crates/ulo-rpc-udp",
    "crates/ulo-rpc-nats",
    "crates/ulo-rpc-redis",
    "crates/ulo-rpc-rabbitmq",
    "crates/ulo-rpc-mqtt",
    "crates/ulo-rpc-kafka",
    "crates/ulo-rpc-conformance",
    "crates/ulo-grpc",
    "crates/ulo-grpc-macros",
    "crates/ulo-build",
    "crates/ulo-codegen-tests",
    "crates/ulo-graphql",
    "crates/ulo-graphql-http",
    "crates/ulo-graphql-ws",
    "crates/ulo-graphql-async-graphql",
    "crates/ulo-graphql-juniper",
    "crates/ulo-cli",
]
# Crates not yet ported to the DI redesign; each moves to `members` once it is.
exclude = [
    "crates/ulo-config",
    "crates/ulo-db-diesel",
    "crates/ulo-db-mongodb",
    "crates/ulo-db-prisma",
    "crates/ulo-db-redis",
    "crates/ulo-db-seaorm",
    "crates/ulo-db-sqlx",
    "crates/ulo-health",
    "integration-tests",
    "examples",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ulo-rs/ulo"
homepage = "https://github.com/ulo-rs/ulo"

[workspace.dependencies]
actix-http = { version = "3", default-features = false }
actix-service = "2"
actix-web = { version = "4", default-features = false }
anyhow = "1.0.95"
async-graphql = { version = "7", default-features = false }
async-lock = "3.4"
async-nats = { version = "0.46", default-features = false }
async-trait = "0.1.86"
axum = { version = "0.8", default-features = false }
bytes = "1"
ciborium = "0.2"
futures = { version = "0.3", default-features = false, features = ["std"] }
futures-core = "0.3"
futures-timer = "3"
futures-util = "0.3"
h2 = "0.4"
headers = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
ignore-files = "3.0.5"
juniper = "0.16"
lapin = "4"
libc = "0.2"
multer = "3"
parking_lot = "0.12"
percent-encoding = "2"
pin-project-lite = "0.2"
poem = { version = "3.1", default-features = false }
proc-macro2 = "1.0.92"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3.2"
quote = "1.0.38"
rdkafka = "0.39"
redis = { version = "1", features = ["aio", "tokio-comp"] }
reqwest = { version = "0.13", default-features = false }
rmp-serde = "1"
rocket = { version = "0.5", default-features = false }
rumqttc = "0.25"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.9"
salvo = { version = "0.92", default-features = false }
serde = "1.0.217"
serde_json = "1.0.137"
socket2 = "0.6"
syn = "2.0.94"
testcontainers = "0.27.3"
testcontainers-modules = "0.15.0"
tokio = { version = "1.47", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.28", default-features = false }
tonic = { version = "0.14", default-features = false }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = "0.14"
tonic-types = "0.14"
tower = { version = "0.5", default-features = false }
tracing = "0.1"
trybuild = "1.0.110"
uuid = "1.11"
validator = "0.20.0"
watchexec = "8.2"
watchexec-filterer-globset = "8.0"
watchexec-filterer-ignore = "7.0"
watchexec-signals = "5.0"
