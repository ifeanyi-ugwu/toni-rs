[package]
name = "ulo-db-sqlx"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "SQLx integration for the Ulo framework"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
sqlite = ["sqlx/sqlite"]
runtime-tokio-rustls = ["sqlx/runtime-tokio-rustls"]
runtime-tokio-native-tls = ["sqlx/runtime-tokio-native-tls"]
health = ["dep:ulo-health", "dep:serde_json", "dep:futures"]
integration = ["health", "postgres", "runtime-tokio-rustls"]

[dependencies]
ulo = { path = "../ulo", default-features = false }
# Timer for the startup check's retry delay. Executor-independent, so core stays free of a
# runtime and this crate does not acquire one either.
futures-timer.workspace = true
sqlx = { version = "0.8", default-features = false }
async-trait.workspace = true
parking_lot.workspace = true
tracing.workspace = true
ulo-health = { path = "../ulo-health", default-features = false, optional = true }
serde_json = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls"], default-features = false }
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
ulo-http-hyper = { path = "../ulo-http-hyper" }
reqwest = { workspace = true, features = ["json"] }
anyhow.workspace = true
