[package]
name = "ulo-build"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Build-script code generation for ulo-grpc: messages, clients and the method markers handlers bind to, over a vendored protoc"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "grpc", "tonic", "build", "codegen"]
categories = ["development-tools::build-utils"]

[features]
# A vendored `protoc`, so no system protoc is needed; a `PROTOC` environment variable wins over it.
default = ["vendored-protoc"]
vendored-protoc = ["dep:protoc-bin-vendored"]

[dependencies]
prost-build.workspace = true
protoc-bin-vendored = { workspace = true, optional = true }
tonic-prost-build.workspace = true
