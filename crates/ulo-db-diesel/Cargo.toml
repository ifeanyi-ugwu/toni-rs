[package]
name = "ulo-db-diesel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Diesel async integration for the Ulo framework"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
postgres = ["diesel-async/postgres", "diesel/postgres_backend"]
mysql = ["diesel-async/mysql"]
health = ["dep:ulo-health", "dep:serde_json", "dep:futures"]
integration = ["health", "postgres"]

[dependencies]
ulo = { path = "../ulo", default-features = false }
# Timer for the startup check's retry delay. Executor-independent, so core stays free of a
# runtime and this crate does not acquire one either.
futures-timer.workspace = true
diesel-async = { version = "0.8", features = ["deadpool"], default-features = false }
diesel = { version = "2", default-features = false }
async-trait.workspace = true
tracing.workspace = true
ulo-health = { path = "../ulo-health", default-features = false, optional = true }
serde_json = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
diesel-async = { version = "0.8", features = ["deadpool", "postgres"], default-features = false }
diesel = { version = "2", features = ["postgres_backend"], default-features = false }
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
ulo-http-hyper = { path = "../ulo-http-hyper" }
reqwest = { workspace = true, features = ["json"] }
anyhow.workspace = true
