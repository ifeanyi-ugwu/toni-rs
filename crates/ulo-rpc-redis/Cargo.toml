[package]
name = "ulo-rpc-redis"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The Redis link for Ulo RPC: Pub/Sub per pattern carrying the whole frame"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "rpc", "redis"]
