[package]
name = "ulo-rpc-redis"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The Redis link for Ulo RPC: Pub/Sub per pattern carrying the whole frame"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "rpc", "redis"]
categories = ["network-programming"]

[features]
# `rediss://`, through rustls with the webpki roots.
tls = ["redis/tokio-rustls-comp", "redis/tls-rustls-webpki-roots"]

[dependencies]
ulo = { path = "../ulo" }
ulo-rpc = { path = "../ulo-rpc" }
futures-core.workspace = true
futures-util.workspace = true
redis = { workspace = true, features = ["connection-manager"] }
tokio = { workspace = true, features = ["sync", "rt", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
