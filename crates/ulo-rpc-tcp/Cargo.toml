[package]
name = "ulo-rpc-tcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The TCP link for Ulo RPC: length-prefixed frames multiplexed by id over one connection"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "rpc", "tcp"]
categories = ["network-programming"]

[dependencies]
ulo = { path = "../ulo" }
ulo-rpc = { path = "../ulo-rpc" }
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
ulo-net = { path = "../ulo-net" }
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "macros", "time"] }
tokio-rustls.workspace = true
tracing.workspace = true

[dev-dependencies]
ulo-rpc-conformance = { path = "../ulo-rpc-conformance" }
ulo-tokio = { path = "../ulo-tokio" }
ulo-transport = { path = "../ulo-transport" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
