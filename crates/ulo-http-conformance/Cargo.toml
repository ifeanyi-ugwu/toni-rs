[package]
name = "ulo-http-conformance"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The embedding conformance suite every Ulo HTTP host runs, the hyper backend as the reference"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# A dev-dependency of the adapter crates and of nothing else.
publish = false

[features]
# The test fairing through which the suite reads `Routing` from rocket's request-local cache.
rocket = ["dep:rocket"]

[dependencies]
ulo = { path = "../ulo" }
# `tokio-io`: the echo upgrade handler reads `Upgraded` through tokio's traits.
ulo-http = { path = "../ulo-http", features = ["tokio-io"] }
ulo-http-hyper = { path = "../ulo-http-hyper" }
ulo-tokio = { path = "../ulo-tokio" }
ulo-transport = { path = "../ulo-transport" }
bytes.workspace = true
futures-util.workspace = true
# An HTTP/2 client that sees the GOAWAY frame itself, which reqwest does not expose.
h2.workspace = true
http.workspace = true
reqwest = { workspace = true, features = ["http2"] }
rocket = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "net", "io-util", "sync"] }
