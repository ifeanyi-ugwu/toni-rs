[package]
name = "ulo-macros"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "Macros for Ulo"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["asynchronous", "network-programming", "web-programming"]

[lib]
name = "ulo_macros"
path = "src/lib.rs"
proc-macro = true

[dependencies]
proc-macro2 = "1.0.92"
quote = "1.0.38"
syn = { version = "2.0.94", features = ["full", "visit-mut"] }
