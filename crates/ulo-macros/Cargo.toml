[package]
name = "ulo-macros"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "Macros for Ulo"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["asynchronous", "network-programming", "web-programming"]

[lib]
name = "ulo_macros"
path = "src/lib.rs"
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full", "visit-mut"] }
# The `__handler` grammar and the key and shared-value emission `#[routes]` writes, defined once
# for `#[routes]` and every transport attribute.
ulo-handler-codegen = { path = "../ulo-handler-codegen" }
