[package]
name = "ulo"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
keywords = ["http", "web", "framework"]
categories = ["asynchronous", "network-programming", "web-programming"]
description = "Fast and modular web framework for scalable applications"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
# The runtime-free async once-cell behind the per-execution cache and the shutdown outcome.
async-lock = "3.4"
ulo-macros = { path = "../ulo-macros" }
# The `warn` for a panic raised while a spawned task's future is dropped, which no caller is
# waiting to receive.
tracing.workspace = true
