[package]
name = "ulo-http-axum"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The axum backend for Ulo's HTTP transport"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "axum", "web", "framework", "backend"]
categories = ["web-programming::http-server"]

[dependencies]
ulo = { path = "../ulo" }
ulo-http = { path = "../ulo-http" }
ulo-net = { path = "../ulo-net" }
axum = { workspace = true, features = ["http1", "http2", "tokio"] }
http.workspace = true
http-body-util.workspace = true
# The per-request upgrade future, `hyper::upgrade::on`, and its I/O adapter.
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["net", "rt", "sync", "macros"] }
tokio-rustls.workspace = true
tower.workspace = true
tracing.workspace = true
