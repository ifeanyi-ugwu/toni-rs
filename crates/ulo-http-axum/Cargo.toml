[package]
name = "ulo-http-axum"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Runs a Ulo application inside an axum server, nested under a path or as the fallback"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "axum", "embedding", "web"]
categories = ["web-programming::http-server"]

[dependencies]
ulo = { path = "../ulo" }
# `tokio-io`: hyper's upgraded I/O reaches `Upgraded` through tokio's traits.
ulo-http = { path = "../ulo-http", features = ["tokio-io"] }
axum = { workspace = true, features = ["tokio", "http1", "http2", "original-uri"] }
http.workspace = true
# The upgrade future axum's server leaves in the request's extensions, and its I/O as tokio's traits.
hyper.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
tower.workspace = true

[dev-dependencies]
ulo-http-conformance = { path = "../ulo-http-conformance" }
# `tests/websocket.rs`: a gateway reached through `WsModule`'s hand-off inside axum.
ulo-tokio = { path = "../ulo-tokio" }
ulo-ws = { path = "../ulo-ws" }
futures-util.workspace = true
serde_json.workspace = true
tokio-tungstenite = { workspace = true, features = ["handshake"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync"] }
