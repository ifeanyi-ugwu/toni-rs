[package]
name = "ulo-rpc-mqtt"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The MQTT v5 link for Ulo RPC: shared subscriptions, Response Topic and Correlation Data"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "rpc", "mqtt"]
categories = ["network-programming"]

[dependencies]
ulo = { path = "../ulo" }
ulo-rpc = { path = "../ulo-rpc" }
ulo-transport = { path = "../ulo-transport" }
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
# rumqttc's default `use-rustls` is what `mqtts://` connects through.
rumqttc.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[features]
# Builds `tests/conformance.rs`, which starts an MQTT broker in a container per scenario and so needs
# a running Docker daemon.
integration = []

[dev-dependencies]
testcontainers.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util"] }
ulo-rpc-conformance = { path = "../ulo-rpc-conformance" }
