[package]
name = "ulo-db-mongodb"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "MongoDB integration for the Ulo framework"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
health = ["dep:ulo-health", "dep:serde_json", "dep:futures"]
integration = ["health"]

[dependencies]
ulo = { path = "../ulo", default-features = false }
# Timer for the startup check's retry delay. Executor-independent, so core stays free of a
# runtime and this crate does not acquire one either.
futures-timer.workspace = true
mongodb = { version = "3" }
async-trait.workspace = true
tracing.workspace = true
ulo-health = { path = "../ulo-health", default-features = false, optional = true }
serde_json = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
mongodb = { version = "3" }
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["mongo"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
ulo-http-hyper = { path = "../ulo-http-hyper" }
reqwest = { workspace = true, features = ["json"] }
futures = { workspace = true, features = ["async-await", "executor"] }
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
