[package]
name = "ulo-grpc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The gRPC transport for Ulo: handlers bound to generated method markers, an HTTP/2 server, status details, health, reflection and clients"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "grpc", "tonic", "framework"]
categories = ["network-programming", "web-programming"]

[dependencies]
ulo = { path = "../ulo" }
ulo-grpc-macros = { path = "../ulo-grpc-macros" }
ulo-http = { path = "../ulo-http" }
ulo-hyper-serve = { path = "../ulo-hyper-serve" }
# The accept loop's listener: tonic is tokio-only, so the server is too.
ulo-listen-tokio = { path = "../ulo-listen-tokio" }
ulo-net = { path = "../ulo-net" }
ulo-transport = { path = "../ulo-transport" }
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
http.workspace = true
http-body.workspace = true
hyper = { workspace = true, features = ["server", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
prost.workspace = true
prost-types.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
# `tls-ring` and `tls-native-roots`: a client channel's TLS, `ClientTls::system_roots` reading the
# platform's trust store.
tonic = { workspace = true, features = ["server", "channel", "codegen", "tls-ring", "tls-native-roots"] }
tonic-health.workspace = true
tonic-prost.workspace = true
tonic-reflection.workspace = true
tonic-types.workspace = true
# `util`: `ServiceExt::oneshot`, which calls the health and reflection services.
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
