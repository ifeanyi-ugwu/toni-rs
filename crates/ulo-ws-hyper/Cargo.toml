[package]
name = "ulo-ws-hyper"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The standalone WebSocket server for Ulo: gateways declared `port = own`, on hyper and tokio"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "websocket", "hyper", "server"]
categories = ["web-programming::websocket", "network-programming"]

[dependencies]
ulo = { path = "../ulo" }
# `tokio-io`: hyper's upgraded connection, on tokio's I/O traits, becomes `ulo-ws`'s `futures-io`
# stream through `Upgraded::from_tokio`.
ulo-http = { path = "../ulo-http", features = ["tokio-io"] }
ulo-hyper-serve = { path = "../ulo-hyper-serve" }
ulo-net = { path = "../ulo-net" }
ulo-transport = { path = "../ulo-transport" }
ulo-ws = { path = "../ulo-ws" }
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
# The responses' bodies.
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
tracing.workspace = true

[dev-dependencies]
ulo-tokio = { path = "../ulo-tokio" }
# `sink`: the tests write through `SinkExt` on the client's socket.
futures-util = { workspace = true, features = ["sink"] }
# The MessagePack gateway's frames, which `messages.rs` encodes and decodes.
rmp-serde.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "sync", "net", "io-util"] }
# `connect`: the tests drive each gateway through a real WebSocket client.
tokio-tungstenite = { workspace = true, features = ["connect"] }
