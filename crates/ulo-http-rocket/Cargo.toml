[package]
name = "ulo-http-rocket"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Runs a Ulo application inside a rocket server, mounted as catch-all routes"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "rocket", "embedding", "web"]
categories = ["web-programming::http-server"]

[dependencies]
ulo = { path = "../ulo" }
ulo-http = { path = "../ulo-http" }
bytes.workspace = true
http.workspace = true
rocket = { workspace = true, features = ["http2"] }
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
