[package]
name = "ulo-http-rocket"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Runs a Ulo application inside a rocket server, mounted as catch-all routes"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "rocket", "embedding", "web"]
categories = ["web-programming::http-server"]

[dependencies]
ulo = { path = "../ulo" }
# `tokio-io`: rocket's `IoStream` implements tokio's traits.
ulo-http = { path = "../ulo-http", features = ["tokio-io"] }
bytes.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
rocket = { workspace = true, features = ["http2"] }
tokio = { workspace = true, features = ["io-util", "sync"] }
tracing.workspace = true

[dev-dependencies]
ulo-http-conformance = { path = "../ulo-http-conformance", features = ["rocket"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync"] }
