[package]
name = "ulo-ws-redis"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The Redis broadcast adapter for Ulo's WebSocket transport, carrying broadcasts across processes"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "websocket", "redis", "broadcast"]
categories = ["web-programming::websocket"]

[dependencies]
ulo = { path = "../ulo" }
ulo-ws = { path = "../ulo-ws" }
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
# `tokio-rustls-comp`: `rediss://` connects over TLS.
redis = { workspace = true, features = ["tokio-rustls-comp"] }
serde_json.workspace = true
# `time`: the reconnect delay of a lost subscription.
tokio = { workspace = true, features = ["sync", "rt", "time"] }
tracing.workspace = true
