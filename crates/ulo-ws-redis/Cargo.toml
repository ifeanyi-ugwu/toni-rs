[package]
name = "ulo-ws-redis"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Redis-backed cross-process WebSocket broadcasting for the Ulo framework"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
integration = []

[dependencies]
ulo = { path = "../ulo", default-features = false }
redis = { workspace = true, features = ["tokio-comp"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
futures-util.workspace = true

[dev-dependencies]
ulo-http-hyper = { path = "../ulo-http-hyper" }
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["redis"] }
ulo-macros = { path = "../ulo-macros" }
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
