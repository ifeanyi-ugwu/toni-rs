[package]
name = "ulo-rpc-udp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The UDP link for Ulo RPC: one frame per datagram, unary calls and events"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "rpc", "udp"]
categories = ["network-programming"]

[dependencies]
ulo = { path = "../ulo" }
ulo-rpc = { path = "../ulo-rpc" }
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
ulo-net = { path = "../ulo-net" }
tokio = { workspace = true, features = ["net", "sync", "rt", "macros", "time"] }
tracing.workspace = true

[dev-dependencies]
ulo-rpc-conformance = { path = "../ulo-rpc-conformance" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
