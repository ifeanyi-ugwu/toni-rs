[package]
name = "ulo-ws"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The WebSocket transport for Ulo: gateways, sessions, rooms and broadcast, on the HTTP server's port or its own"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "websocket", "gateway", "framework"]
categories = ["web-programming::websocket", "asynchronous"]

[dependencies]
ulo = { path = "../ulo" }
ulo-http = { path = "../ulo-http" }
ulo-hyper-serve = { path = "../ulo-hyper-serve" }
ulo-net = { path = "../ulo-net" }
ulo-transport = { path = "../ulo-transport" }
ulo-ws-macros = { path = "../ulo-ws-macros" }
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
http.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
rmp-serde.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "rt"] }
tokio-tungstenite = { workspace = true, features = ["handshake"] }
tracing.workspace = true
