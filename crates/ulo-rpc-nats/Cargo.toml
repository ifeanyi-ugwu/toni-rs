[package]
name = "ulo-rpc-nats"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The NATS link for Ulo RPC: queue-group subscriptions, inbox replies, no-responders"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "rpc", "nats"]
categories = ["network-programming"]

[dependencies]
ulo = { path = "../ulo" }
ulo-rpc = { path = "../ulo-rpc" }
ulo-transport = { path = "../ulo-transport" }
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
# `ring` is async-nats's TLS provider, which it refuses to compile without, so `tls://` works in
# every build.
async-nats = { workspace = true, features = ["ring"] }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tracing.workspace = true

[features]
# Builds `tests/conformance.rs`, which starts a NATS server in a container per scenario and so needs
# a running Docker daemon.
integration = []

[dev-dependencies]
testcontainers.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
ulo-rpc-conformance = { path = "../ulo-rpc-conformance" }
