[package]
name = "ulo-rpc-kafka"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The Kafka link for Ulo RPC: consumer groups, a reply topic and correlation headers"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "rpc", "kafka"]
categories = ["network-programming"]

[features]
# `security.protocol=SSL`, selected by an `ssl://` broker entry, through librdkafka's OpenSSL.
tls = ["rdkafka/ssl"]
# Builds `tests/conformance.rs`, which starts a Kafka broker in a container per scenario and so
# needs a running Docker daemon.
integration = []

[dependencies]
ulo = { path = "../ulo" }
ulo-rpc = { path = "../ulo-rpc" }
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
rdkafka.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
testcontainers.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
ulo-rpc-conformance = { path = "../ulo-rpc-conformance" }
