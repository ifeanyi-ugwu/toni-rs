[package]
name = "ulo-http-salvo"
version = "0.1.0"
edition.workspace = true
description = "Runs a Ulo application inside a salvo server, nested under a path or as the catch-all"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "salvo", "embedding", "web"]
categories = ["web-programming::http-server"]
rust-version = "1.92"

[dependencies]
ulo = { path = "../ulo" }
# `tokio-io`: hyper's upgraded I/O reaches `Upgraded` through tokio's traits.
ulo-http = { path = "../ulo-http", features = ["tokio-io"] }
bytes.workspace = true
http.workspace = true
http-body.workspace = true
# The upgrade future salvo leaves in the request's extensions, and its I/O as tokio's traits.
hyper.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
salvo = { workspace = true, features = ["server", "server-handle", "http1", "http2"] }

[dev-dependencies]
ulo-http-conformance = { path = "../ulo-http-conformance", features = ["tokio"] }
# `tests/ws_conformance.rs`: the WebSocket suite against `WsModule`'s hand-off inside salvo.
ulo-ws-conformance = { path = "../ulo-ws-conformance" }
ulo-tokio = { path = "../ulo-tokio" }
ulo-ws = { path = "../ulo-ws" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
