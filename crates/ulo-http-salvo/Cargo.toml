[package]
name = "ulo-http-salvo"
version = "0.1.0"
edition.workspace = true
description = "Runs a Ulo application inside a salvo server, nested under a path or as the catch-all"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "salvo", "embedding", "web"]
categories = ["web-programming::http-server"]
rust-version = "1.92"

[dependencies]
ulo = { path = "../ulo" }
ulo-http = { path = "../ulo-http" }
http.workspace = true
salvo = { workspace = true, features = ["server", "http1", "http2"] }
tracing.workspace = true
