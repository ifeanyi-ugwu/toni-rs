[package]
name = "ulo-graphql-ws"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "GraphQL subscriptions for Ulo over graphql-transport-ws, a WebSocket gateway over any engine"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "graphql", "websocket", "subscriptions"]
