[dependencies]
ulo = { path = "../ulo" }
ulo-graphql = { path = "../ulo-graphql" }
ulo-transport = { path = "../ulo-transport" }
ulo-ws = { path = "../ulo-ws" }
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
