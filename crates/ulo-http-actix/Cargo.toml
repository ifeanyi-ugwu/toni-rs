[package]
name = "ulo-http-actix"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Runs a Ulo application inside an actix-web server, as a scope or the default service"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "actix", "embedding", "web"]
categories = ["web-programming::http-server"]

[features]
# Turns on actix-web's `http2`, as any crate in an application can, and builds
# `tests/conformance_http2.rs`, which runs the conformance suite against an h2c host so the
# adapter's HTTP/2 drain declaration is asserted. The adapter's own code reads no feature.
conformance-http2 = ["actix-web/http2"]

[dependencies]
ulo = { path = "../ulo" }
ulo-http = { path = "../ulo-http" }
actix-http.workspace = true
actix-service.workspace = true
actix-web.workspace = true
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
http-body.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
ulo-http-conformance = { path = "../ulo-http-conformance" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync"] }

[[test]]
name = "conformance_http2"
required-features = ["conformance-http2"]

