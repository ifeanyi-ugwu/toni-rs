[package]
name = "ulo-http-actix"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Runs a Ulo application inside an actix-web server, as a scope or the default service"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "actix", "embedding", "web"]
categories = ["web-programming::http-server"]

[dependencies]
