[package]
name = "ulo-http-hyper"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The hyper backend for Ulo's HTTP transport, the reference server"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "hyper", "web", "framework", "backend"]
categories = ["web-programming::http-server"]

[dependencies]
ulo = { path = "../ulo" }
ulo-http = { path = "../ulo-http" }
# The accept loop, the TLS handshake and the drain, shared with the gRPC and WebSocket servers.
ulo-hyper-serve = { path = "../ulo-hyper-serve" }
ulo-net = { path = "../ulo-net" }
ulo-transport = { path = "../ulo-transport" }
http.workspace = true
# The connection builders, configured from the server's settings; the per-request upgrade future
# and its I/O adapter come from the same two crates.
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio", "server-auto"] }
tokio = { workspace = true, features = ["macros"] }
tracing.workspace = true

[dev-dependencies]
ulo-http-conformance = { path = "../ulo-http-conformance" }
ulo-tokio = { path = "../ulo-tokio" }
futures-util.workspace = true
# `net` and `io-util`: the raw HTTP/1.1 client the route-timeout tests read a response with.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
