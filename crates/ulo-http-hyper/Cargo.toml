[package]
name = "ulo-http-hyper"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The hyper backend for Ulo's HTTP transport, the reference server"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "hyper", "web", "framework", "backend"]
categories = ["web-programming::http-server"]

[dependencies]
ulo = { path = "../ulo" }
ulo-http = { path = "../ulo-http" }
ulo-net = { path = "../ulo-net" }
ulo-transport = { path = "../ulo-transport" }
http.workspace = true
# The connection builders, configured from the server's settings; the per-request upgrade future
# and its I/O adapter come from the same two crates.
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio", "server-auto"] }
# `time`: the accept loop's back-off and the TLS handshake timeout.
tokio = { workspace = true, features = ["net", "rt", "sync", "macros", "time"] }
tokio-rustls.workspace = true
tracing.workspace = true
