[package]
name = "ulo-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The HTTP transport for Ulo: routing, extractors, responses, SSE, pre-dispatch middleware, the backend SPI and the embedding surface"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "http", "web", "framework"]
categories = ["web-programming::http-server", "asynchronous"]

[dependencies]
ulo = { path = "../ulo" }
ulo-http-macros = { path = "../ulo-http-macros" }
ulo-net = { path = "../ulo-net" }
ulo-transport = { path = "../ulo-transport" }
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
headers.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
# The upgrade future a hyper-based host stores on a request, taken by `embed::Service`, and its
# I/O as tokio's traits.
hyper.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
multer.workspace = true
percent-encoding.workspace = true
pin-project-lite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The I/O traits an upgraded connection implements. Every clock is the app's `Timer`.
tokio = { workspace = true, features = ["io-util"] }
tower.workspace = true
tracing.workspace = true
