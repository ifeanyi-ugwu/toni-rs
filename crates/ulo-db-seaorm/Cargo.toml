[package]
name = "ulo-db-seaorm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "SeaORM integration for the Ulo framework"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
sqlx-postgres = ["sea-orm/sqlx-postgres"]
sqlx-mysql = ["sea-orm/sqlx-mysql"]
sqlx-sqlite = ["sea-orm/sqlx-sqlite"]
runtime-tokio-rustls = ["sea-orm/runtime-tokio-rustls"]
runtime-tokio-native-tls = ["sea-orm/runtime-tokio-native-tls"]
health = ["dep:ulo-health", "dep:serde_json", "dep:futures"]
integration = ["health", "sqlx-postgres", "runtime-tokio-rustls"]

[dependencies]
ulo = { path = "../ulo", default-features = false }
# Timer for the startup check's retry delay. Executor-independent, so core stays free of a
# runtime and this crate does not acquire one either.
futures-timer.workspace = true
sea-orm = { version = "1", default-features = false }
async-trait.workspace = true
parking_lot.workspace = true
tracing.workspace = true
ulo-health = { path = "../ulo-health", default-features = false, optional = true }
serde_json = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls"], default-features = false }
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
ulo-http-hyper = { path = "../ulo-http-hyper" }
reqwest = { workspace = true, features = ["json"] }
anyhow.workspace = true
