[package]
name = "ulo-http-poem"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Runs a Ulo application inside a poem server, nested under a path or as the fallback"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "poem", "embedding", "web"]
categories = ["web-programming::http-server"]

[dependencies]
ulo = { path = "../ulo" }
# `tokio-io`: poem's upgraded I/O implements tokio's traits.
ulo-http = { path = "../ulo-http", features = ["tokio-io"] }
bytes.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
poem = { workspace = true, features = ["server"] }

[dev-dependencies]
ulo-http-conformance = { path = "../ulo-http-conformance", features = ["tokio"] }
# `tests/ws_conformance.rs`: the WebSocket suite against `WsModule`'s hand-off inside poem.
ulo-ws-conformance = { path = "../ulo-ws-conformance" }
ulo-tokio = { path = "../ulo-tokio" }
ulo-ws = { path = "../ulo-ws" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync"] }
