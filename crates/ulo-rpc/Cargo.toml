[package]
name = "ulo-rpc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The RPC transport for Ulo: one frame grammar over TCP, UDP and message brokers, the four call shapes, and the client"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "rpc", "microservices", "framework"]
categories = ["network-programming", "asynchronous"]

[dependencies]
ulo = { path = "../ulo" }
ulo-rpc-macros = { path = "../ulo-rpc-macros" }
ulo-transport = { path = "../ulo-transport" }
# `serde` so `Bytes` and `Payload<Bytes>` travel as a CBOR byte string.
bytes = { workspace = true, features = ["serde"] }
ciborium.workspace = true
# No runtime here, as in the core: tasks are spawned through the app's `Runtime`, and these are
# the runtime-free primitives in place of `tokio::sync`. The client's connection lock.
async-lock.workspace = true
# The server's close signal and drain state, the primitive `async-lock` is built on.
event-listener.workspace = true
# A streamed request's items and each call's reply frames.
futures-channel.workspace = true
futures-core.workspace = true
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
tracing.workspace = true

[dev-dependencies]
ulo-tokio = { path = "../ulo-tokio" }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
