[package]
name = "toni-rocket"
version = "0.1.0"
edition = "2021"
description = "Rocket adapter for the Toni framework"
license = "MIT"
keywords = ["toni", "rocket", "web", "framework", "adapter"]
categories = ["web-programming::http-server"]

[dependencies]
toni = { path = "../toni" }
rocket = "0.5"
rocket_ws = "0.1"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
serde_json = "1.0"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }
tokio-tungstenite = "0.28"
toni-macros = { path = "../toni-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
