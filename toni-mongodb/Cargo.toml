[package]
name = "toni-mongodb"
version = "0.1.0"
edition = "2024"
description = "MongoDB integration for the Toni framework"
license = "MIT"
repository = "https://github.com/monterxto/toni-rs"
homepage = "https://github.com/monterxto/toni-rs"

[features]
health = ["dep:toni-terminus", "dep:serde_json", "dep:futures"]
integration = ["health"]

[dependencies]
toni = { path = "../toni" }
mongodb = { version = "3" }
async-trait = "0.1"
tracing = "0.1"
toni-terminus = { path = "../toni-terminus", default-features = false, optional = true }
serde_json = { version = "1", optional = true }
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
mongodb = { version = "3" }
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["mongo"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toni-axum = { path = "../toni-axum" }
reqwest = { version = "0.13.2", features = ["json"] }
futures = { version = "0.3", features = ["std"] }
