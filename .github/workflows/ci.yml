name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: check (all features, all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --all-features compiles the feature-gated test targets (e.g. the DB
      # crates' `integration` health tests) that a default build never touches.
      # --locked fails on a manifest/lockfile mismatch instead of silently
      # resolving fresh versions the repo doesn't record.
      - run: cargo check --workspace --all-features --all-targets --locked

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      # Broken intra-doc links are warnings by default, so they rot unnoticed:
      # every one this gate was written for dated from an earlier rename.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --all-features because a doc comment behind a feature gate is only
      # linted when that feature is on, and --no-deps because upstream crates'
      # doc warnings are not ours to fix.
      - run: cargo doc --workspace --all-features --no-deps --locked

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Hermetic suites only — everything here runs against localhost with no
      # external services. Broker and DB crates keep their service-dependent
      # tests behind feature gates and are compile-checked in the check job.
      - run: cargo test -p toni --lib --locked
      - run: cargo test -p integration-tests --locked

  scaffold:
    name: cli scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p toni-cli --locked
      # `toni new` output pins published crate versions; patching them to the
      # checkout verifies the templates against the code under review. A version
      # bump that forgets to update the templates fails here loudly.
      - name: scaffold a project and compile it
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/target/debug/toni" new scaffold-smoke
          cd scaffold-smoke
          "$GITHUB_WORKSPACE/target/debug/toni" generate resource user
          cat >> Cargo.toml <<EOF
          [patch.crates-io]
          toni = { path = "$GITHUB_WORKSPACE/toni" }
          toni-macros = { path = "$GITHUB_WORKSPACE/toni-macros" }
          toni-axum = { path = "$GITHUB_WORKSPACE/toni-axum" }
          EOF
          cargo check
