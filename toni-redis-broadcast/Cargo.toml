[package]
name = "toni-redis-broadcast"
version = "0.1.0"
edition = "2024"
description = "Redis-backed cross-process WebSocket broadcasting for the Toni framework"
license = "MIT"
repository = "https://github.com/monterxto/toni-rs"
homepage = "https://github.com/monterxto/toni-rs"

[features]
integration = []

[dependencies]
toni = { path = "../toni" }
redis = { version = "1", features = ["tokio-comp"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
futures-util = "0.3"

[dev-dependencies]
toni-axum = { path = "../toni-axum" }
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15", features = ["redis"] }
